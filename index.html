<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube + Twitch 同時視聴ビューワー</title>
<link rel="stylesheet" href="assets/styles.css?v=20260922">
</head>
<body>
<div id="app">
  <!-- ===== Toolbar ===== -->
  <div id="toolbar">
    <div class="group">
      <div class="logo"><span class="yt"></span><span class="tw"></span><span>同時視聴</span></div>
    </div>
    <div class="group">
      <span class="group-label">一括</span>
      <button class="ctrl-btn primary" id="playAllBtn" title="すべて再生 (Space)"><span class="ico">▶</span> 再生</button>
      <button class="ctrl-btn" id="pauseAllBtn" title="すべて一時停止"><span class="ico">⏸</span> 停止</button>
    </div>
    <div class="group">
      <span class="group-label">音量</span>
      <button class="ctrl-btn" id="muteAllBtn" title="すべてミュート (M)"><span class="ico">🔇</span> 全ミュート</button>
      <button class="ctrl-btn" id="unmuteAllBtn" title="すべてミュート解除"><span class="ico">🔊</span> 解除</button>
      <button class="ctrl-btn" id="soloBtn" title="フォーカスのみ音を出す">🎯 ソロ</button>
      <div class="vol-wrap">
        <input id="masterVol" type="range" min="0" max="100" value="5" title="マスター音量">
        <span class="vol-label" id="masterVolLabel">5</span>
      </div>
    </div>
    <div class="group">
      <span class="group-label">レイアウト</span>
      <div class="layout-tiles" id="layoutTiles"></div>
    </div>
    <div class="spacer" style="flex:1"></div>
    <div class="group">
      <button class="ctrl-btn" id="clearBtn" title="すべての枠を空にする"><span class="ico">🗑</span> 全クリア</button>
      <span style="font-size: 12px; color: var(--text-muted); padding: 0 8px;" id="countLabel">0</span>
    </div>
    <div class="group" style="border-right:0; padding-right:2px">
      <button class="icon-btn" id="popoutNewBtn" title="枠を別ウィンドウで追加">🪟</button>
      <button class="icon-btn" id="settingsBtn" title="設定（視聴者数 API キー）"><span class="ico">⚙</span></button>
      <button class="icon-btn" id="fullscreenBtn" title="全画面 (F)"><span class="ico">⛶</span></button>
      <button class="icon-btn" id="helpBtn" title="ヘルプ"><span class="ico">?</span></button>
      <button class="icon-btn" id="hideToolbarBtn" title="ヘッダーを隠す (H)" aria-label="ヘッダーを隠す">︿</button>
    </div>
  </div>

  <!-- ===== Main ===== -->
  <main id="main"></main>
</div>

<button id="showToolbarBtn" type="button" aria-label="ヘッダーを表示">﹀ ヘッダーを表示</button>

<div id="toast"></div>

<div id="nijisanjiOverlay" class="hidden">
  <div id="nijisanjiPanel">
    <div class="nijisanji-head">
      <div class="nijisanji-head-title">
        <span class="live-dot"></span>ON AIR — にじさんじ
      </div>
      <button id="nijisanjiCloseBtn" class="nijisanji-close">×</button>
    </div>
    <div class="nijisanji-body" id="nijisanjiBody">
      <div class="nijisanji-loading">読み込み中…</div>
    </div>
  </div>
</div>

<div id="ikioiOverlay" class="hidden">
  <div id="ikioiPanel">
    <div class="nijisanji-head">
      <div class="nijisanji-head-title">🔥 勢いランキング — 配信を追加</div>
      <button id="ikioiCloseBtn" class="nijisanji-close">×</button>
    </div>
    <div class="ikioi-search">
      <input id="ikioiKeyword" type="text" placeholder="キーワード（例: Vtuber, ホロライブ, Apex…）" spellcheck="false">
      <button id="ikioiSearchBtn" type="button">検索</button>
    </div>
    <div class="nijisanji-body" id="ikioiBody">
      <div class="nijisanji-loading">読み込み中…</div>
    </div>
  </div>
</div>

<div id="vmiruOverlay" class="hidden">
  <div id="vmiruPanel">
    <div class="nijisanji-head">
      <div class="nijisanji-head-title">📺 ぶいみる — 配信を追加</div>
      <button id="vmiruCloseBtn" class="nijisanji-close">×</button>
    </div>
    <div class="vmiru-cats" id="vmiruCats"></div>
    <div class="nijisanji-body" id="vmiruBody">
      <div class="nijisanji-loading">読み込み中…</div>
    </div>
  </div>
</div>

<div id="settingsOverlay" class="hidden">
  <div id="settingsPanel">
    <div class="settings-head">⚙ 設定</div>
    <div class="settings-body">
      <label for="settingsKeyInput">YouTube Data API v3 キー</label>
      <div class="key-row">
        <input id="settingsKeyInput" type="password" placeholder="AIza... (空欄で視聴者数機能オフ)" autocomplete="off" spellcheck="false">
        <button class="icon-btn" id="settingsKeyReveal" type="button" title="表示/非表示">👁</button>
      </div>
      <p class="hint">
        設定すると各枠に<b>同時視聴者数</b>が表示されます。キーはこのブラウザにのみ保存され、外部には送信しません（YouTube API への問い合わせのみ）。<br>
        取得方法: <a href="https://console.cloud.google.com/" target="_blank" rel="noopener">Google Cloud Console</a> → 「YouTube Data API v3」を有効化 → 認証情報で API キーを作成。<br>
        公開サイトで使う場合は、キーに<b>HTTP リファラー制限</b>を設定してください。
      </p>
    </div>
    <div class="settings-foot">
      <span id="settingsStatus"></span>
      <div class="btn-row">
        <button class="ctrl-btn" id="settingsCancelBtn" type="button">閉じる</button>
        <button class="ctrl-btn primary" id="settingsSaveBtn" type="button">保存</button>
      </div>
    </div>
  </div>
</div>

<script src="assets/app.js?v=20260922"></script>
</body>
</html>
